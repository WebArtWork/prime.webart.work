<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Prime Templates</title>
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			try {
				const storedMode = localStorage.getItem('app-mode');
				const preferredMode =
					storedMode === 'dark' || storedMode === 'light'
						? storedMode
						: window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				document.documentElement.setAttribute('data-mode', preferredMode);
			} catch {}
		</script>

		<meta
			name="description"
			content="Prime Templates — Angular 22 templates from Web Art Work. Free to download, with paid licenses coming soon."
		/>
		<meta name="author" content="Prime Templates" />
		<meta name="robots" content="index, follow" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />

		<meta itemprop="name" content="Prime Templates" />
		<meta
			itemprop="description"
			content="Angular 22 templates from Web Art Work. Free to download, with paid licenses coming soon."
		/>
		<meta itemprop="image" content="https://prime.webart.work/logo.png" />

		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Prime Templates" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:url" content="https://prime.webart.work/" />
		<meta property="og:title" content="Prime Templates" />
		<meta
			property="og:description"
			content="Angular 22 templates from Web Art Work. Free to download, with paid licenses coming soon."
		/>
		<meta property="og:image" content="https://prime.webart.work/logo.png" />

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Prime Templates" />
		<meta
			name="twitter:description"
			content="Angular 22 templates from Web Art Work. Free to download, with paid licenses coming soon."
		/>
		<meta name="twitter:image" content="https://prime.webart.work/logo.png" />
		<meta name="twitter:image:src" content="https://prime.webart.work/logo.png" />

		<link rel="canonical" href="https://prime.webart.work/" />
		<link rel="icon" type="image/x-icon" href="favicon.png" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
			rel="stylesheet"
		/>
		<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
	</head>
	<body>
		<app-root></app-root>
	</body>
</html>
